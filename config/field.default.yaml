# ============================================================
# field.default.yaml —— 场地默认参数配置
#
# 比赛场地 3000×3000mm。决赛现场可能调整区域位置。
# ============================================================

field:
  size_mm: [3000, 3000]
  fence_height_mm: 100

  # 出发区 (4 个角落, 300×300mm)
  start_zones:
    red_left:    { x: 0,    y: 0,    width: 300, height: 300 }
    red_right:   { x: 2700, y: 0,    width: 300, height: 300 }
    blue_left:   { x: 0,    y: 2700, width: 300, height: 300 }
    blue_right:  { x: 2700, y: 2700, width: 300, height: 300 }

  # 安全区（红顶/蓝底，正中间 x 1200~1800，内部 600×300，分区 300×300，紫边 30）
  safe_zones:
    red:
      x: 1200
      y: 2670
      width: 600
      height: 300
      supply_area:   { x: 1200, y: 2670, width: 300, height: 300 }   # 物资区（左）
      injured_area:  { x: 1500, y: 2670, width: 300, height: 300 }   # 伤员区（右）
    blue:
      x: 1200
      y: 30
      width: 600
      height: 300
      supply_area:   { x: 1500, y: 30, width: 300, height: 300 }     # 物资区（右）
      injured_area:  { x: 1200, y: 30, width: 300, height: 300 }     # 伤员区（左）

  # 禁区
  forbidden:
    opponent_safe_zone_margin_mm: 50
    boundary_margin_mm: 100
    warning_distance_mm: 150

  # 减速带
  speed_bumps:
    count_per_zone: 3
    width_mm: 30
    height_mm: 5

  # 对抗参数
  opponent:
    contact_warning_s: 7.0
    contact_force_s: 9.0
    contact_limit_s: 10.0
    distance_critical_mm: 350
    distance_high_mm: 500
    distance_medium_mm: 1000

  # 本队颜色 (赛前抽签后修改)
  my_color: "red"
