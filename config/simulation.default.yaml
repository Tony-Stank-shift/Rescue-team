# simulation.default.yaml —— MuJoCo 3D 仿真配置
#
# 板块 9: 开发工具链与测试 — 仿真环境
# See src/rescue_robot/simulation/
#

# ============================================================
# 物理仿真
# ============================================================
physics:
  timestep: 0.004              # 仿真步长 (s), 250Hz
  gravity: [0.0, 0.0, -9.81]   # 重力加速度 (m/s²)
  solver: "newton"             # 求解器: newton | pgs | cg
  iterations: 50               # 求解器迭代次数
  tolerance: 1.0e-6            # 收敛容差

# ============================================================
# 决策与控制
# ============================================================
control:
  decision_timestep: 0.02      # 决策步长 (s), 50Hz
  physics_substeps: 5          # 每决策步的物理子步数
  time_scale: 1.0              # 仿真速度倍率 (1.0 = 实时, 2.0 = 2倍速)

# ============================================================
# 比赛参数
# ============================================================
match:
  duration_s: 180.0            # 比赛总时长
  phase: "preliminary"         # preliminary | final
  start_zone: 1                # 出发区 (1-4)
  my_safe_zone: "red"          # red | blue
  seed: null                   # 随机种子 (null = 随机)

# ============================================================
# 目标配置
# ============================================================
targets:
  count: 20                    # 目标数量 (初赛20, 决赛25)
  spawn_area:                  # 生成区域 (m)
    x_min: 0.20
    x_max: 2.80
    y_min: 0.50
    y_max: 2.50
  avoid_zones: true            # 避开安全区和出发区

# ============================================================
# 对手配置
# ============================================================
opponent:
  enabled: true                # 是否有对手
  behavior: "competitive"      # random | competitive | aggressive
  start_zone: 2                # 对手机器人出发区

# ============================================================
# 传感器仿真
# ============================================================
sensors:
  camera:
    enabled: true
    detection_range_m: 2.0     # 检测范围
    fov_deg: 90                # 视场角
    position_noise_m: 0.005    # 位置噪声
    false_positive_rate: 0.0   # 假阳性率
    false_negative_rate: 0.05  # 假阴性率
  imu:
    enabled: true
    gyro_noise_std: 0.005      # 陀螺仪噪声 (rad/s/√Hz)
    accel_noise_std: 0.01      # 加速度计噪声 (m/s²/√Hz)
  odometry:
    enabled: true
    position_noise_per_m: 0.01 # 每米位置漂移
    heading_noise_per_rad: 0.005 # 每弧度航向漂移

# ============================================================
# 渲染
# ============================================================
rendering:
  window_width: 1280           # 窗口宽度 (px)
  window_height: 720           # 窗口高度 (px)
  camera_distance: 4.0         # 相机距离 (m)
  camera_azimuth: 0.0          # 方位角 (deg)
  camera_elevation: -30.0      # 仰角 (deg)
  show_trail: true             # 显示轨迹
  show_labels: true            # 显示标签

# ============================================================
# 测试
# ============================================================
testing:
  headless: false              # 无头模式
  screenshot_path: "screenshots/"  # 截图保存路径
  log_events: true             # 记录事件日志
