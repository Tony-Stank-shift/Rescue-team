# ============================================================
# robot.default.yaml —— 机器人默认参数配置
#
# 现场调试时直接修改此文件，保存后热加载生效 (DEBUG 模式)。
# AUTONOMOUS 模式下热加载自动禁用。
# ============================================================

robot:
  # 时序参数 (单位: ms)
  timing:
    button_debounce_ms: 50
    button_long_press_ms: 500
    led_boot_blink_interval_ms: 500
    led_auto_blink_interval_ms: 200
    self_check_timeout_s: 10
    sensor_check_timeout_ms: 3000
    motor_check_duration_ms: 500
    post_start_delay_ms: 1000

  # 硬件阈值
  thresholds:
    battery_min_voltage: 11.0
    battery_max_voltage: 12.6
    motor_min_current_ma: 50
    motor_max_current_ma: 5000
    camera_min_fps: 10

  # 电机参数
  motors:
    count: 2
    pid:
      kp: 0.8
      ki: 0.01
      kd: 0.05
    pid_angle:
      kp: 1.5
      ki: 0.0
      kd: 0.1
    max_speed_mm_s: 850
    max_angular_speed_rad_s: 3.0
    wheel_base_mm: 209

  # 策略权重 —— **这里才是生效的那一份**（T2-14）：
  # 由 config.apply_robot_config() 注入 TargetSelector，现场改完保存即生效。
  #   distance_weight  ↑ → 更强调"就近"（=0 → 距离不参与）
  #   points_weight    ↑ → 更强调分值（=0.5 为基准；↑ → 更愿意跑远拿高分）
  #   time_weight      ↑ → 更早进入时间紧迫模式、末段加成更强（=0 → 时间不参与）
  #   opponent_factor  ↓ → 对方盯上的目标被压得更狠（=1.0 → 完全不避让）
  # ⚠️ 下面这 4 个值就是"与旧公式等价"的基准值，别随手改：
  #    改大改小都会真的改变选目标行为 → 必须重跑 5 种子集成仿真回归。
  # ⚠️ `config/strategy/{default,aggressive,conservative}.yaml` 里的
  #    strategy_weights 是**死配置**（没有任何生产代码读取那三个文件，
  #    唯一的引用方 innovation/hot_reloader.py 自身也无调用方）→ 改那里无效。
  strategy_weights:
    distance_weight: 0.3
    points_weight: 0.5
    time_weight: 0.2
    opponent_factor: 0.5

  # 比赛参数
  # ⚠️ 现场公布后可直接改，无需重编译（决赛创新实践环节现场改参数）
  match:
    duration_s: 180          # ❓ 比赛时长：赛项 PDF **未给出**具体秒数，可能现场公布 → 现场按裁判公布值修改
    time_pressure_s: 30      # 时间紧迫阈值（剩余秒数低于此值→只抢高分目标）
    nav_timeout_s: 10
    grip_timeout_s: 3
    transport_timeout_s: 15

  # 降级策略
  fallback:
    max_retries: 3
    watchdog_warn_s: 10
    watchdog_critical_s: 13
    watchdog_timeout_s: 15
    stuck_time_s: 5
    stuck_distance_mm: 30

  # 套取/投放机构几何 + 扣分（⚠️ 真机标定项，现场改这里即可，无需重编译）
  placement:
    # 释放瞬间目标（在车头 U 型槽内）相对车心的前伸距离(mm)：
    # 投放有效性判定用它把"车身位置"换算成"目标落点"。必须真机标定。
    # ⚠️ N-6：不能太大。红/蓝物资区 y 向只有 300mm、完全置入可用 280mm，
    #    150mm 已占 54% → 落点被推到围栏上 → 首趟有效投放接近抛硬币
    #    （实测车心停在区域中心时 9 个朝向里 4 个判无效）。默认降到 70。
    #    现场实测"目标放进 U 型槽后车心到目标的前伸距离"再改这里。
    drop_forward_mm: 70.0
    # 推式放置时朝斜坡方向的推入距离(mm)，同样需真机标定。
    push_dist_mm: 100.0
    # ❓ 该数值来源不明：赛项 PDF 只写"无效目标被取出重新随机放置场地中央"，
    #    未给扣分细则；暂按 10 分/个，现场确认后改这里。
    penalty_per_target: 10
    # 一趟最多能**真正套住**几个目标 = 套取机构的物理容量。
    # ⚠️ 实测结论：**只能填 1**。填 >1 会被强制回退到 1 并打 ERROR 日志。
    #    原因一（物理）：U 型槽由单只 SG90 驱动，"套住(0°)/释放(70°)"只有一个
    #      自由度，且每次下压前都要先抬爪（抬爪 = 释放）→ 先套住的目标会被放掉。
    #    原因二（代码）：多目标逐个套取的机构侧虽已实现，但决策引擎的 grip_done
    #      契约仍假设一趟只套 1 个，容量 >1 时它会在套取途中下发 TRANSPORT_TO
    #      把导航目标抢走 → 空耗时间（受控 A/B：=1 送 7~8 个 / 80 分；
    #      =3 只送 4 个 / 50 分，更差）。详见 docs/audit/FIXES.md 的 S-40。
    #    真要调大：先改决策引擎耦合（套取全程不许下发 TRANSPORT_TO，
    #      且 grip_done 必须等整趟计划套完才置真），再重跑 5 种子回归。
    sleeve_max_hold: 1

# 感知参数
perception:
  # 目标颜色 → 类型映射 (决赛现场可能变更)
  target_color_map:
    regular: "green"
    core: "black"
    injured: "orange"
    dangerous: "light_blue"

  # 检测阈值
  detection:
    min_confidence: 0.6
    association_threshold_mm: 100
    stale_frames: 3
    remove_frames: 30

# 通信参数
communication:
  websocket_port: 8765
  heartbeat_interval_s: 0.5
  reconnect_backoff_max_s: 30

# 日志参数
logging:
  max_log_size_mb: 50
  max_total_size_mb: 500
  keep_recent_matches: 20
